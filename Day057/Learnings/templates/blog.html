<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Blog</title>
</head>
<body>

{% for blog in all_blogs: %}
        <h1>{{ blog["title"] }}</h1> <!-- Here blog is an dictionary attribute set in server.py and title, subtitle are its keys. -->
        <h2>{{ blog["subtitle"] }}</h2>
{% endfor %}

</body>
</html>
